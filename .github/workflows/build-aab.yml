name: Build Proxyma Connect AAB (Google Play)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --channel=0 --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        sed -i '10i\    ndkVersion = "30.0.16248370"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Build libhevtun
      run: |
        bash compile-hevtun.sh

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v6.3.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Disable ABI splits for AAB
      run: |
        sed -i 's/isEnable = true/isEnable = false/g' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Build PlayStore AAB
      env:
        SUB_BASE_URL: ${{ secrets.SUB_BASE_URL }}
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew bundlePlaystoreRelease

    - name: Sign Release AAB
      run: |
        echo "${{ secrets.SIGNING_KEY }}" | base64 -d > release.jks
        AAB_PATH=$(find ${{ github.workspace }}/V2rayNG/app/build/outputs/bundle/playstoreRelease -name "*.aab" | head -n 1)
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
          -keystore release.jks \
          -storepass "${{ secrets.KEY_STORE_PASSWORD }}" \
          -keypass "${{ secrets.KEY_PASSWORD }}" \
          "$AAB_PATH" "${{ secrets.ALIAS }}"
        rm -f release.jks

    - name: Upload Proxyma Connect AAB
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: Proxyma-Connect-PlayStore-AAB
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/bundle/playstoreRelease/*.aab
