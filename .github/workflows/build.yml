name: Build Proxyma Connect APK
on:
  push:
    branches: [ master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Download libv2ray.aar
        run: |
          mkdir -p V2rayNG/app/libs
          AAR_URL=$(curl -s https://github.com | grep -oE '"browser_download_url": "[^"]+\.aar"' | head -n 1 | cut -d'"' -f4)
          echo "Downloading from: $AAR_URL"
          curl -fL -o V2rayNG/app/libs/libv2ray.aar "$AAR_URL"
      - name: Build APK
        working-directory: ./V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew assembleFdroidDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Proxyma-Connect-APK
          path: V2rayNG/app/build/outputs/apk/fdroid/debug/*.apk
          
