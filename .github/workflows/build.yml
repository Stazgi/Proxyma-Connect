name: Build Proxyma Connect APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --channel=0 --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        sed -i '10i\    ndkVersion = "30.0.16248370"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Build libhevtun
      run: |
        bash compile-hevtun.sh

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app
          
    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        git fetch --tags --force
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd
        
    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v6.3.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build Release APK
      env:
        SUB_BASE_URL: ${{ secrets.SUB_BASE_URL }}
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew assembleFdroidRelease

    - name: Sign Release APK
      run: |
        echo "${{ secrets.SIGNING_KEY }}" | base64 -d > release.jks
        BUILD_TOOLS="$ANDROID_HOME/build-tools/37.0.0"
        RELEASE_DIR="${{ github.workspace }}/V2rayNG/app/build/outputs/apk/fdroid/release"
        for apk in "$RELEASE_DIR"/*.apk; do
          aligned="${apk%.apk}-aligned.apk"
          signed="${apk%.apk}-signed.apk"
          "$BUILD_TOOLS/zipalign" -v -p 4 "$apk" "$aligned"
          "$BUILD_TOOLS/apksigner" sign --ks release.jks --ks-key-alias "${{ secrets.ALIAS }}" --ks-pass "pass:${{ secrets.KEY_STORE_PASSWORD }}" --key-pass "pass:${{ secrets.KEY_PASSWORD }}" --out "$signed" "$aligned"
        done
        rm -f release.jks

    - name: Upload Proxyma Connect APK (arm64-v8a)
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: Proxyma-Connect-arm64-v8a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/fdroid/release/*arm64-v8a*-signed.apk

    - name: Upload Proxyma Connect APK (armeabi-v7a 32-bit)
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: Proxyma-Connect-armeabi-v7a-32bit
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/fdroid/release/*armeabi-v7a*-signed.apk
