name: Build Proxyma Connect APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
        steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build AndroidLibXrayLite
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          git clone https://github.com
          cd AndroidLibXrayLite
          gomobile bind -v -androidapi 21 -ldflags='-s -w' ./
          mkdir -p ../V2rayNG/app/libs
          cp libv2ray.aar ../V2rayNG/app/libs/

      - name: Build Debug APK
        working-directory: ./V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew assembleFdroidDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Proxyma-Connect-APK
          path: V2rayNG/app/build/outputs/apk/fdroid/debug/*.apk
          
